name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PersianAiChat.sln

      - name: Build
        run: dotnet build PersianAiChat.sln --no-restore -c Release

      - name: Test
        run: dotnet test PersianAiChat.sln --no-build -c Release --verbosity normal
